<!doctype html>
<!--
  [INPUT]: 依赖同目录外置 CSS/JS 与本地 JSON/GIF；人体 SVG、目录索引与训练计划行由 main.js 组装，文案由 data-i18n 键位填充
  [OUTPUT]: 提供离线动作目录、肌肉热力图、动作详情、训练计划可用性说明与可访问的多动作 dialog 语义骨架
  [POS]: gui 固定唯一入口；只承载 DOM/i18n 键位，不含 inline script、外链、token 或 owner 身份
  [PROTOCOL]: 变更时更新此头部，然后检查 README.md
-->
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Fitness Log</title>
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./plan.css">
    <script defer src="./scripts/i18n.js"></script>
    <script defer src="./scripts/base-api.js"></script>
    <script defer src="./scripts/catalog.js"></script>
    <script defer src="./scripts/muscle-stats.js"></script>
    <script defer src="./scripts/plan-builder.js"></script>
    <script defer src="./scripts/plan-submission.js"></script>
    <script defer src="./scripts/main.js"></script>
  </head>
  <body>
    <header class="app-header">
      <div class="masthead-rule"></div>
      <div class="masthead">
        <div class="masthead-text">
          <p class="eyebrow" data-i18n="app.eyebrow"></p>
          <h1 data-i18n="app.heading"></h1>
          <p class="subtitle" data-i18n="app.subtitle"></p>
        </div>
        <div class="header-actions">
          <div class="revision" aria-live="polite"><span data-i18n="app.revision"></span><strong id="revision">—</strong></div>
          <div class="plan-entry">
            <button id="create-plan" class="primary" type="button" disabled aria-describedby="plan-disabled-reason" data-i18n="plan.create"></button>
          </div>
        </div>
      </div>
      <p id="plan-disabled-reason" class="plan-availability" role="status" data-i18n="plan.disabled.readonly"></p>
    </header>

    <main>
      <section class="heat-panel" aria-labelledby="heat-title">
        <div class="section-heading">
          <div><p class="eyebrow" data-i18n="map.eyebrow"></p><h2 id="heat-title" data-i18n="map.title"></h2></div>
          <div class="map-controls">
            <label class="field"><span data-i18n="map.body"></span>
              <span class="field-wrap">
                <select id="gender">
                  <option value="male" data-i18n="map.body.male"></option>
                  <option value="female" data-i18n="map.body.female"></option>
                </select>
              </span>
            </label>
            <label class="field"><span data-i18n="map.range"></span>
              <span class="field-wrap">
                <select id="range">
                  <option value="7" data-i18n="map.range.7"></option>
                  <option value="30" selected data-i18n="map.range.30"></option>
                  <option value="90" data-i18n="map.range.90"></option>
                  <option value="all" data-i18n="map.range.all"></option>
                </select>
              </span>
            </label>
          </div>
        </div>
        <div id="status" class="status" role="status" data-i18n="status.loading"></div>
        <figure class="plate">
          <div class="plate-inner">
            <div class="body-maps">
              <figure><figcaption data-i18n="map.front"></figcaption>
                <svg class="body" data-view="front" role="img" data-i18n-aria="map.frontAria"></svg>
              </figure>
              <figure><figcaption data-i18n="map.back"></figcaption>
                <svg class="body" data-view="back" role="img" data-i18n-aria="map.backAria"></svg>
              </figure>
            </div>
            <div class="plate-key">
              <span class="key-title" data-i18n="map.legendTitle"></span>
              <div class="key-scale">
                <div><i data-level="0"></i><span>0</span></div>
                <div><i data-level="1"></i><span>1</span></div>
                <div><i data-level="2"></i><span>2</span></div>
                <div><i data-level="3"></i><span>3</span></div>
                <div><i data-level="4"></i><span>4</span></div>
              </div>
              <span class="key-note" data-i18n="map.legendNote"></span>
            </div>
          </div>
        </figure>
        <section id="muscle-detail" class="detail" aria-live="polite"></section>
      </section>

      <section class="catalog-panel" aria-labelledby="catalog-title">
        <div class="section-heading">
          <div><p class="eyebrow" id="catalog-eyebrow"></p><h2 id="catalog-title" data-i18n="catalog.title"></h2></div>
          <button id="clear" class="ghost" type="button" data-i18n="catalog.clear"></button>
        </div>
        <label class="field search"><span data-i18n="catalog.search"></span>
          <input id="query" type="search" data-i18n-placeholder="catalog.searchHint">
        </label>
        <div class="filters">
          <label class="field"><span data-i18n="catalog.bodyPart"></span>
            <span class="field-wrap"><select id="body-filter"><option value="" data-i18n="catalog.all"></option></select></span></label>
          <label class="field"><span data-i18n="catalog.muscle"></span>
            <span class="field-wrap"><select id="muscle-filter"><option value="" data-i18n="catalog.all"></option></select></span></label>
          <label class="field"><span data-i18n="catalog.equipment"></span>
            <span class="field-wrap"><select id="equipment-filter"><option value="" data-i18n="catalog.all"></option></select></span></label>
        </div>
        <p class="result-line"><span id="result-count"></span><span id="result-showing"></span></p>
        <div id="catalog" class="catalog" aria-live="polite"></div>
        <button id="more" class="more" type="button" data-i18n="catalog.more"></button>
      </section>
    </main>

    <dialog id="exercise-dialog" aria-labelledby="exercise-title">
      <div class="sheet-inner">
        <div class="sheet-head">
          <div><p class="eyebrow" data-i18n="dialog.eyebrow"></p><h2 id="exercise-title"></h2></div>
          <button class="dialog-close" type="button" data-i18n-aria="dialog.close">×</button>
        </div>
        <div id="exercise-detail"></div>
      </div>
    </dialog>

    <dialog id="plan-dialog" aria-labelledby="plan-title">
      <form id="plan-form" method="dialog">
        <div class="sheet-head">
          <div><p class="eyebrow" data-i18n="plan.eyebrow"></p><h2 id="plan-title" data-i18n="plan.title"></h2></div>
          <button id="plan-close" class="dialog-close" type="button" data-i18n-aria="dialog.close">×</button>
        </div>
        <p id="plan-hint" class="subtitle" data-i18n="plan.hint"></p>
        <label class="field plan-date-field"><span data-i18n="plan.date"></span><input id="plan-date" type="date" required></label>
        <fieldset id="plan-items">
          <legend data-i18n="plan.exercises"></legend>
          <div class="plan-cols" aria-hidden="true">
            <span></span>
            <span data-i18n="plan.searchLabel"></span>
            <span data-i18n="plan.exercise"></span>
            <span data-i18n="plan.sets"></span>
            <span data-i18n="plan.weightCol"></span>
            <span></span>
          </div>
          <div id="plan-list"></div>
        </fieldset>
        <button id="plan-add" class="btn" type="button" data-i18n="plan.add"></button>
        <p id="plan-state" class="plan-state" role="alert" aria-live="assertive"></p>
        <div class="dialog-actions">
          <button id="plan-cancel" type="button" data-i18n="plan.cancel"></button>
          <button id="plan-save" class="primary" type="button" data-i18n="plan.save"></button>
        </div>
      </form>
    </dialog>

    <template id="plan-row-template">
      <div class="plan-row">
        <span class="plan-no"></span>
        <span class="plan-cell"><input class="plan-exercise-search" type="search" data-i18n-placeholder="plan.search" data-i18n-aria="plan.searchLabel" autocomplete="off"></span>
        <span class="plan-cell"><select class="plan-exercise-select" required data-i18n-aria="plan.exercise"></select></span>
        <span class="plan-cell num"><input class="plan-sets" type="number" min="1" step="1" value="3" required inputmode="numeric" data-i18n-aria="plan.sets"><em class="unit" data-i18n="plan.setsUnit"></em></span>
        <span class="plan-cell num"><input class="plan-weight" type="number" min="0" step="0.5" value="0" required inputmode="decimal" data-i18n-aria="plan.weight"><em class="unit" data-i18n="plan.weightUnit"></em></span>
        <button class="plan-remove" type="button" data-i18n-aria="plan.remove">×</button>
      </div>
    </template>
    <div id="plan-announcement" class="sr-only" aria-live="polite"></div>
    <footer><span data-i18n="footer.sources"></span> <span id="media-credit"></span> <span data-i18n="footer.disclaimer"></span></footer>
  </body>
</html>
